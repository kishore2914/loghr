name: loghr_mobile
description: A Flutter employee management application for LogHR
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  go_router: ^13.0.0
  intl: ^0.19.0
  geolocator: ^11.0.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  fl_chart: ^0.66.0
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  pdf: ^3.11.1
  printing: ^5.13.3
  open_filex: ^4.5.1
  http: ^1.1.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
